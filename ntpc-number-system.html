/* =========================
   QUIZ SYSTEM
========================= */

const text = ui[language] || ui.bn;

let currentQuestion = 0;
let score = 0;
let answered = false;


document.documentElement.lang = language;

document.getElementById("title").innerText =
text.title;

document.getElementById("backText").innerText =
text.back;

document.getElementById("nextBtn").innerText =
text.next;

document.getElementById("finishedText").innerText =
text.finished;

document.getElementById("restartBtn").innerText =
text.restart;


function loadQuestion() {

answered = false;

const question =
questions[currentQuestion];

const qData =
question[language] || question.bn;


document.getElementById("progress").innerText =
text.question + " " +
(currentQuestion + 1) +
" / " +
questions.length;


document.getElementById("score").innerText =
text.score + ": " + score;


document.getElementById("question").innerText =
(currentQuestion + 1) + ". " + qData.q;


const options =
document.getElementById("options");

options.innerHTML = "";

document.getElementById("result").innerText = "";

document.getElementById("nextBtn").style.display =
"none";


qData.o.forEach((option, index) => {

const button =
document.createElement("button");

button.className = "option";

button.innerText =
String.fromCharCode(65 + index) +
") " +
option;

button.onclick = function() {
checkAnswer(button, index);
};

options.appendChild(button);

});

}


function checkAnswer(button, selectedIndex) {

if (answered) return;

answered = true;

const question =
questions[currentQuestion];

const qData =
question[language] || question.bn;

const buttons =
document.querySelectorAll(".option");

const result =
document.getElementById("result");


if (selectedIndex === question.answer) {

button.classList.add("correct");

score++;

result.innerText =
text.correct;

result.style.color =
"#15803d";

} else {

button.classList.add("wrong");

buttons[question.answer]
.classList.add("correct");

result.innerText =
text.wrong +
" — " +
text.correctAnswer +
" " +
String.fromCharCode(
65 + question.answer
) +
") " +
qData.o[question.answer];

result.style.color =
"#dc2626";

}


document.getElementById("score").innerText =
text.score + ": " + score;

document.getElementById("nextBtn").style.display =
"block";

}


function nextQuestion() {

currentQuestion++;

if (currentQuestion < questions.length) {

loadQuestion();

} else {

showFinalScore();

}

}


function showFinalScore() {

document.getElementById("quizArea").style.display =
"none";

document.getElementById("scoreBox").style.display =
"block";

document.getElementById("finalScore").innerText =
text.final +
" " +
score +
" / " +
questions.length;

}


function restartQuiz() {

currentQuestion = 0;
score = 0;
answered = false;

document.getElementById("quizArea").style.display =
"block";

document.getElementById("scoreBox").style.display =
"none";

loadQuestion();

}


loadQuestion();

</script>
