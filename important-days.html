let current = 0;
let score = 0;
let answered = 0;

const questionText = document.getElementById("questionText");
const questionNumber = document.getElementById("questionNumber");
const optionsArea = document.getElementById("optionsArea");
const feedback = document.getElementById("feedback");
const nextBtn = document.getElementById("nextBtn");

function renderQuestion() {

  const item = questions[current];

  questionNumber.textContent = "প্রশ্ন " + (current + 1);
  questionText.textContent = item.q;

  optionsArea.innerHTML = "";
  feedback.style.display = "none";
  nextBtn.style.display = "none";

  item.o.forEach((option, index) => {

    const button = document.createElement("button");
    button.className = "option";
    button.textContent = String.fromCharCode(65 + index) + ") " + option;

    button.addEventListener("click", () => selectAnswer(index));

    optionsArea.appendChild(button);

  });

  document.getElementById("progressText").textContent =
    "প্রশ্ন " + (current + 1) + " / " + questions.length;

  document.getElementById("scoreText").textContent =
    "স্কোর: " + score;

  document.getElementById("answeredText").textContent =
    "উত্তর দেওয়া হয়েছে: " + answered;

  document.getElementById("progressFill").style.width =
    (current / questions.length * 100) + "%";
}

function selectAnswer(selected) {

  const item = questions[current];
  const buttons = optionsArea.querySelectorAll(".option");

  if (buttons[0].disabled) return;

  answered++;

  buttons.forEach((button, index) => {

    button.disabled = true;

    if (index === item.a) {
      button.classList.add("correct");
    }

    if (index === selected && selected !== item.a) {
      button.classList.add("wrong");
    }

  });

  if (selected === item.a) {

    score++;

    feedback.innerHTML =
      "<strong>✓ সঠিক উত্তর!</strong><br>" + item.e;

  } else {

    feedback.innerHTML =
      "<strong>✗ ভুল উত্তর!</strong><br>" +
      "সঠিক উত্তর: " + item.o[item.a] +
      "<br>" + item.e;

  }

  feedback.style.display = "block";
  nextBtn.style.display = "block";

  document.getElementById("scoreText").textContent =
    "স্কোর: " + score;

  document.getElementById("answeredText").textContent =
    "উত্তর দেওয়া হয়েছে: " + answered;

  if (current === questions.length - 1) {
    nextBtn.textContent = "ফলাফল দেখো";
  }
}

function nextQuestion() {

  if (current < questions.length - 1) {

    current++;
    renderQuestion();

  } else {

    showResult();

  }
}

function showResult() {

  document.getElementById("quizArea").style.display = "none";

  const resultArea = document.getElementById("resultArea");
  resultArea.style.display = "block";

  document.getElementById("finalScore").textContent =
    score + " / " + questions.length;

  const percentage = Math.round(score / questions.length * 100);

  let message = "";

  if (percentage >= 80) {
    message = "দারুণ ফলাফল! তোমার প্রস্তুতি ভালো হয়েছে।";
  } else if (percentage >= 50) {
    message = "ভালো চেষ্টা! আরও একবার অনুশীলন করো।";
  } else {
    message = "চিন্তা করো না। আবার পড়ে কুইজটি দাও।";
  }

  document.getElementById("resultMessage").textContent =
    message + " তোমার প্রাপ্ত নম্বর " + percentage + "%।";

  document.getElementById("progressFill").style.width = "100%";
}

function restartQuiz() {

  current = 0;
  score = 0;
  answered = 0;

  document.getElementById("quizArea").style.display = "block";
  document.getElementById("resultArea").style.display = "none";

  nextBtn.textContent = "পরের প্রশ্ন →";

  renderQuestion();
}

renderQuestion();

</script>
