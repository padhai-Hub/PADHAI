<!DOCTYPE html>
<html lang="bn">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NTPC Mathematics - PADHAI</title>

<script>
const savedLanguage = localStorage.getItem("padhaiLanguage");

if (!savedLanguage) {
  window.location.replace("language.html");
}
</script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f7fb;
  color: #1f2937;
}

header {
  background: #2563eb;
  color: white;
  text-align: center;
  padding: 22px 15px;
}

header h1 {
  margin: 0 0 6px;
}

.container {
  max-width: 750px;
  margin: auto;
  padding: 18px;
}

.back {
  display: inline-block;
  margin-bottom: 18px;
  color: #2563eb;
  text-decoration: none;
  font-weight: bold;
}

.info {
  background: #fff7ed;
  padding: 13px;
  border-radius: 10px;
  margin-bottom: 18px;
}

.topic-list {
  display: grid;
  gap: 10px;
}

.topic {
  display: block;
  background: white;
  padding: 16px;
  border-radius: 11px;
  text-decoration: none;
  color: #1f2937;
  font-weight: bold;
  box-shadow: 0 2px 7px #ddd;
}

.topic:active {
  background: #eef4ff;
}

</style>
</head>


<body>

<header>

<h1>➗ <span id="pageTitle"></span></h1>

<p>RRB NTPC UG</p>

</header>


<div class="container">

<a class="back" href="ntpc-ug.html" id="backText"></a>

<div class="info" id="infoText"></div>

const topicList =

data.topics.forEach(topic => {
