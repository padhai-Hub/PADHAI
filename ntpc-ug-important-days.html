["সুভাষচন্দ্র বসু","Subhas Chandra Bose","सुभाष चंद्र बोस"],
["জওহরলাল নেহরু","Jawaharlal Nehru","जवाहरलाल नेहरू"]
],a:1,
e:["৩০ জানুয়ারি ১৯৪৮ সালে মহাত্মা গান্ধীর মৃত্যুর স্মরণে ভারতে শহিদ দিবস পালন করা হয়।","India observes Martyrs' Day on January 30 in memory of Mahatma Gandhi, who died on that date in 1948.","भारत में 30 जनवरी को महात्मा गांधी की स्मृति में शहीद दिवस मनाया जाता है।"]
}
];

const ui = {
bn:{
next:"পরের প্রশ্ন",finish:"ফলাফল দেখুন",question:"প্রশ্ন",score:"স্কোর",
correct:"সঠিক উত্তর!",wrong:"ভুল উত্তর। সঠিক উত্তরটি চিহ্নিত করা হয়েছে।",
result:"আপনার ফলাফল",out:"মোট",of:"এর মধ্যে",restart:"আবার শুরু করুন",
complete:"সেট সম্পূর্ণ হয়েছে। ভালো চেষ্টা!",
language:"ভাষা"
},
en:{
next:"Next Question",finish:"See Result",question:"Question",score:"Score",
correct:"Correct answer!",wrong:"Incorrect. The correct answer is highlighted.",
result:"Your Result",out:"Total",of:"out of",restart:"Restart",
complete:"Set completed. Good effort!",
language:"Language"
},
hi:{
next:"अगला प्रश्न",finish:"परिणाम देखें",question:"प्रश्न",score:"स्कोर",
correct:"सही उत्तर!",wrong:"गलत उत्तर। सही उत्तर दिखाया गया है।",
result:"आपका परिणाम",out:"कुल",of:"में से",restart:"फिर से शुरू करें",
complete:"सेट पूरा हुआ। अच्छा प्रयास!",
language:"भाषा"
}
};

let lang="bn";
let current=0;
let score=0;
let answered=false;

function changeLanguage(){
lang=document.getElementById("language").value;
render();
}

function render(){
const t=ui[lang];
document.getElementById("setTitle").textContent=
lang==="bn"?"জানুয়ারি – সেট ১":
lang==="en"?"January – Set 1":"जनवरी – सेट 1";

if(current>=questions.length){showResult();return;}

const item=questions[current];
document.getElementById("counter").textContent=
`${t.question} ${current+1} / ${questions.length}`;
document.getElementById("score").textContent=`${t.score}: ${score}`;
document.getElementById("bar").style.width=
`${(current/questions.length)*100}%`;
document.getElementById("question").textContent=item.q[["bn","en","hi"].indexOf(lang)];

const box=document.getElementById("options");
box.innerHTML="";
item.o.forEach((option,index)=>{
const button=document.createElement("button");
button.className="option";
button.textContent=String.fromCharCode(65+index)+". "+option[["bn","en","hi"].indexOf(lang)];
button.onclick=()=>choose(index);
box.appendChild(button);
});

document.getElementById("feedback").style.display="none";
document.getElementById("next").disabled=true;
document.getElementById("next").textContent=
current===questions.length-1?t.finish:t.next;
answered=false;
}

function choose(index){
if(answered)return;
answered=true;
const item=questions[current];
const buttons=document.querySelectorAll(".option");
buttons.forEach((button,i)=>{
button.disabled=true;
if(i===item.a)button.classList.add("correct");
if(i===index && index!==item.a)button.classList.add("wrong");
});
const t=ui[lang];
const feedback=document.getElementById("feedback");
feedback.style.display="block";
feedback.style.background=index===item.a?"#e4f7eb":"#ffebeb";
feedback.style.color=index===item.a?"#126332":"#a32020";
const li=["bn","en","hi"].indexOf(lang);
feedback.textContent=(index===item.a?t.correct:t.wrong)+" "+item.e[li];
if(index===item.a)score++;
document.getElementById("score").textContent=`${t.score}: ${score}`;
document.getElementById("next").disabled=false;
}

function nextQuestion(){
if(!answered)return;
current++;
if(current>=questions.length){showResult();return;}
render();
}

function showResult(){
document.getElementById("quiz").style.display="none";
document.getElementById("result").style.display="block";
const t=ui[lang];
document.getElementById("resultTitle").textContent=t.result;
document.getElementById("resultScore").textContent=
`${t.out}: ${score} ${t.of} ${questions.length}`;
document.getElementById("resultMessage").textContent=t.complete;
document.getElementById("restart").textContent=t.restart;
document.getElementById("bar").style.width="100%";
}

function restartQuiz(){
current=0;score=0;answered=false;
document.getElementById("quiz").style.display="block";
document.getElementById("result").style.display="none";
render();
}

render();
</script>
</body>
</html>
