<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PADHAI - Competitive Exam Preparation</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #1f2937;
    }

    header {
      background: #2563eb;
      color: white;
      padding: 22px 16px;
      text-align: center;
    }

    header h1 {
      font-size: 32px;
      margin-bottom: 5px;
    }

    header p {
      font-size: 14px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 18px;
    }

    .language {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 20px;
    }

    .language button {
      border: none;
      background: white;
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 2px 7px #ddd;
    }

    .search-box {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 25px;
    }

    h2 {
      font-size: 20px;
      margin-bottom: 15px;
    }

    .exam-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .exam-card {
      background: white;
      padding: 22px 10px;
      text-align: center;
      border-radius: 12px;
      box-shadow: 0 2px 8px #ddd;
      font-weight: bold;
      cursor: pointer;
    }

    .exam-card:hover {
      background: #eef4ff;
    }

    .coming {
      margin-top: 30px;
      background: white;
      padding: 18px;
      border-radius: 12px;
      text-align: center;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #777;
      font-size: 13px;
    }
  </style>
</head>

<body>

<header>
  <h1>PADHAI</h1>
  <p>এক প্রস্তুতি, অনেক লক্ষ্য</p>
</header>

<div class="container">

  <div class="language">
    <button>বাংলা</button>
    <button>English</button>
    <button>हिन्दी</button>
  </div>

  <input
    class="search-box"
    type="search"
    placeholder="Topic খুঁজুন..."
  >

  <h2>আপনার পরীক্ষা নির্বাচন করুন</h2>

  <div class="exam-grid">

    <div class="exam-card">
      🪖<br><br>
      Agniveer
    </div>

    <div class="exam-card">
      👮<br><br>
      WB Police
    </div>

    <div class="exam-card">
      👮‍♂️<br><br>
      Kolkata Police
    </div>

    <a href="railway.html" style="text-decoration:none; color:inherit;">
  <div class="exam-card">
    🚆<br><br>
    Railway
  </div>
    </a>

  </div>

  <div class="coming">
    <strong>আরও পরীক্ষা শীঘ্রই আসছে</strong>
    <p>নতুন Exam, Topic ও MCQ নিয়মিত যোগ করা হবে।</p>
  </div>

</div>

<footer>
  © 2026 PADHAI
</footer>
<div style="max-width:700px; margin:30px auto; padding:18px;">

  <h2>আজকের Practice MCQ</h2>

  <div style="background:white; padding:20px; border-radius:12px;">

    <p><b>1. ভারতের জাতীয় সঙ্গীতের রচয়িতা কে?</b></p>

    <button class="mcq-option" onclick="checkAnswer(this, false)">
      A) বঙ্কিমচন্দ্র চট্টোপাধ্যায়
    </button>

    <button class="mcq-option" onclick="checkAnswer(this, true)">
      B) রবীন্দ্রনাথ ঠাকুর
    </button>

    <button class="mcq-option" onclick="checkAnswer(this, false)">
      C) কাজী নজরুল ইসলাম
    </button>

    <button class="mcq-option" onclick="checkAnswer(this, false)">
      D) শরৎচন্দ্র চট্টোপাধ্যায়
    </button>

    <p id="result"></p>

  </div>
</div>

<style>
.mcq-option {
  width: 100%;
  padding: 14px;
  margin: 7px 0;
  text-align: left;
  background: white;
  border: 1px solid #ddd;
  border-radius: 10px;
  font-size: 16px;
}
</style>

<script>
let answered = false;

function checkAnswer(button, correct) {

  if (answered) return;
  answered = true;

  const options = document.querySelectorAll(".mcq-option");
  const result = document.getElementById("result");

  if (correct) {
    button.style.background = "#dcfce7";
    button.style.border = "2px solid #16a34a";

    result.innerHTML = "✅ সঠিক উত্তর!";
    result.style.color = "green";

  } else {
    button.style.background = "#fee2e2";
    button.style.border = "2px solid #dc2626";

    options[1].style.background = "#dcfce7";
    options[1].style.border = "2px solid #16a34a";

    result.innerHTML =
      "❌ ভুল — সঠিক উত্তর: B) রবীন্দ্রনাথ ঠাকুর";

    result.style.color = "red";
  }
}
</script>
</body>
</html>
<div class="exam-card">
  🛡️<br><br>
  SSC GD
</div>
