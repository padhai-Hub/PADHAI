<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PADHAI - Competitive Exam Preparation</title>

  <script>
    /* প্রথমবার language select না করলে Language page-এ যাবে */
    const savedLanguage = localStorage.getItem("padhaiLanguage");

    if (!savedLanguage) {
      window.location.replace("language.html");
    }
  </script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #1f2937;
    }

    header {
      background: #2563eb;
      color: white;
      padding: 22px 16px;
      text-align: center;
    }

    header h1 {
      font-size: 32px;
      margin-bottom: 5px;
    }

    header p {
      font-size: 14px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 18px;
    }

    .language-area {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 18px;
    }

    .language-btn {
      border: none;
      background: white;
      padding: 10px 14px;
      border-radius: 9px;
      cursor: pointer;
      box-shadow: 0 2px 7px #ddd;
      font-weight: bold;
    }

    .search-box {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 25px;
    }

    h2 {
      font-size: 20px;
      margin-bottom: 15px;
    }

    .exam-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .exam-link {
      text-decoration: none;
      color: inherit;
    }

    .exam-card {
      background: white;
      padding: 22px 10px;
      text-align: center;
      border-radius: 12px;
      box-shadow: 0 2px 8px #ddd;
      font-weight: bold;
      cursor: pointer;
      height: 100%;
    }

    .exam-card:hover {
      background: #eef4ff;
    }

    .coming {
      margin-top: 30px;
      background: white;
      padding: 18px;
      border-radius: 12px;
      text-align: center;
    }

    .coming p {
      margin-top: 7px;
    }

    .practice {
      max-width: 700px;
      margin: 10px auto 30px;
      padding: 18px;
    }

    .question-box {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px #ddd;
    }

    .question-box p {
      margin-bottom: 12px;
    }

    .mcq-option {
      width: 100%;
      padding: 14px;
      margin: 7px 0;
      text-align: left;
      background: white;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
    }

    #result {
      margin-top: 12px;
      font-weight: bold;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #777;
      font-size: 13px;
    }

    @media (max-width: 450px) {
      .exam-grid {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>PADHAI</h1>
  <p id="tagline">এক প্রস্তুতি, অনেক লক্ষ্য</p>
</header>

<div class="container">

  <div class="language-area">
    <button class="language-btn" onclick="changeLanguage()">
      🌐 <span id="languageText">ভাষা পরিবর্তন</span>
    </button>
  </div>

  <input
    id="searchBox"
    class="search-box"
    type="search"
    placeholder="Topic খুঁজুন..."
  >

  <h2 id="selectExam">আপনার পরীক্ষা নির্বাচন করুন</h2>

  <div class="exam-grid">

    <div class="exam-card">
      🪖<br><br>
      Agniveer
    </div>

    <div class="exam-card">
      👮<br><br>
      WB Police
    </div>

    <div class="exam-card">
      👮‍♂️<br><br>
      Kolkata Police
    </div>

    <a class="exam-link" href="railway.html">
      <div class="exam-card">
        🚆<br><br>
        Railway
      </div>
    </a>

    <div class="exam-card">
      🛡️<br><br>
      SSC GD
    </div>

  </div>

  <div class="coming">
    <strong id="comingTitle">আরও পরীক্ষা শীঘ্রই আসছে</strong>
    <p id="comingText">
      নতুন Exam, Topic ও MCQ নিয়মিত যোগ করা হবে।
    </p>
  </div>

</div>


<div class="practice">

  <h2 id="practiceTitle">আজকের Practice MCQ</h2>

  <div class="question-box">

    <p id="question">
      <b>1. ভারতের জাতীয় সঙ্গীতের রচয়িতা কে?</b>
    </p>

    <button class="mcq-option"
      data-correct="false"
      onclick="checkAnswer(this)">
      A) বঙ্কিমচন্দ্র চট্টোপাধ্যায়
    </button>

    <button class="mcq-option"
      data-correct="true"
      onclick="checkAnswer(this)">
      B) রবীন্দ্রনাথ ঠাকুর
    </button>

    <button class="mcq-option"
      data-correct="false"
      onclick="checkAnswer(this)">
      C) কাজী নজরুল ইসলাম
    </button>

    <button class="mcq-option"
      data-correct="false"
      onclick="checkAnswer(this)">
      D) শরৎচন্দ্র চট্টোপাধ্যায়
    </button>

    <p id="result"></p>

  </div>

</div>


<footer>
  © 2026 PADHAI
</footer>


<script>

const language = localStorage.getItem("padhaiLanguage") || "bn";


/* HOME PAGE LANGUAGE */

if (language === "bn") {

  document.documentElement.lang = "bn";

  document.getElementById("tagline").innerText =
    "এক প্রস্তুতি, অনেক লক্ষ্য";

  document.getElementById("languageText").innerText =
    "ভাষা পরিবর্তন";

  document.getElementById("searchBox").placeholder =
    "Topic খুঁজুন...";

  document.getElementById("selectExam").innerText =
    "আপনার পরীক্ষা নির্বাচন করুন";

  document.getElementById("comingTitle").innerText =
    "আরও পরীক্ষা শীঘ্রই আসছে";

  document.getElementById("comingText").innerText =
    "নতুন Exam, Topic ও MCQ নিয়মিত যোগ করা হবে।";

  document.getElementById("practiceTitle").innerText =
    "আজকের Practice MCQ";
}


if (language === "hi") {

  document.documentElement.lang = "hi";

  document.getElementById("tagline").innerText =
    "एक तैयारी, कई लक्ष्य";

  document.getElementById("languageText").innerText =
    "भाषा बदलें";

  document.getElementById("searchBox").placeholder =
    "Topic खोजें...";

  document.getElementById("selectExam").innerText =
    "अपनी परीक्षा चुनें";

  document.getElementById("comingTitle").innerText =
    "और परीक्षाएँ जल्द आ रही हैं";

  document.getElementById("comingText").innerText =
    "नए Exam, Topic और MCQ नियमित रूप से जोड़े जाएंगे।";

  document.getElementById("practiceTitle").innerText =
    "आज का Practice MCQ";
}


if (language === "en") {

  document.documentElement.lang = "en";

  document.getElementById("tagline").innerText =
    "One Preparation, Many Goals";

  document.getElementById("languageText").innerText =
    "Change Language";

  document.getElementById("searchBox").placeholder =
    "Search Topic...";

  document.getElementById("selectExam").innerText =
    "Select Your Exam";

  document.getElementById("comingTitle").innerText =
    "More Exams Coming Soon";

  document.getElementById("comingText").innerText =
    "New exams, topics and MCQs will be added regularly.";

  document.getElementById("practiceTitle").innerText =
    "Today's Practice MCQ";
}


/* CHANGE LANGUAGE */

function changeLanguage() {

  localStorage.removeItem("padhaiLanguage");

  window.location.href = "language.html";
}


/* TEST MCQ */

let answered = false;

function checkAnswer(button) {

  if (answered) return;

  answered = true;

  const options =
    document.querySelectorAll(".mcq-option");

  const result =
    document.getElementById("result");

  const correct =
    button.dataset.correct === "true";

  if (correct) {

    button.style.background = "#dcfce7";
    button.style.border = "2px solid #16a34a";

    result.innerHTML = "✅ Correct!";
    result.style.color = "green";

  } else {

    button.style.background = "#fee2e2";
    button.style.border = "2px solid #dc2626";

    options.forEach(option => {

      if (option.dataset.correct === "true") {

        option.style.background = "#dcfce7";
        option.style.border = "2px solid #16a34a";

      }

    });

    result.innerHTML = "❌ Wrong";
    result.style.color = "red";
  }
}

</script>

</body>
</html>
